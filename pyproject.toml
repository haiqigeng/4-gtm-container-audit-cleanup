[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-container-audit-cleanup"
version = "2.0.0"
description = "Independently verified GTM container audit and optimization tooling"
readme = {text = "Container-only GTM web-analyst audit and cleanup tooling.", content-type = "text/plain"}
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["esprima==4.0.1"]
dev = ["coverage>=7.6.0", "ruff>=0.12.0", "vulture>=2.14"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
branch = true
include = [
    "scripts/gtm_audit_contract.py",
    "scripts/gtm_canonical_scan.py",
    "scripts/gtm_consent_model.py",
    "scripts/gtm_obligation_ledger.py",
    "scripts/gtm_operation_model.py",
    "scripts/gtm_optimization_facts.py",
    "scripts/gtm_relationships.py",
    "scripts/gtm_scan_assurance.py",
    "scripts/gtm_source_model.py",
]

[tool.coverage.report]
fail_under = 72
show_missing = true
