[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-container-audit-optimize"
version = "2.1.1"
description = "Independently verified GTM container audit and optimization tooling"
readme = {text = "Static GTM web-container audit and optimization tooling.", content-type = "text/plain"}
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["esprima==4.0.1"]
dev = ["coverage>=7.6.0", "ruff>=0.12.0", "vulture>=2.14"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
branch = true
source = ["scripts"]
relative_files = true

[tool.coverage.report]
fail_under = 65
show_missing = true
