name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The skill is a folder of instructions and scripts, not an installable package: install the dependencies
      # pyproject.toml declares. Ruff is pinned to the version the release was validated with.
      - name: Install dependencies
        run: python -m pip install "openpyxl>=3.1" "pytest>=8" "ruff==0.15.22"
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Tests
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Compile Python sources
        run: python -B -m compileall -q scripts tests
